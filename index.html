<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор зарплаты ПВЗ</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --half1-color: #2563eb;
            --half1-bg: #dbeafe;
            --half2-color: #059669;
            --half2-bg: #d1fae5;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-top: 4px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 24px;
            align-items: start;
        }

        @media (max-width: 860px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .right-column {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
        }

        .card h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
        }

        @media (max-width: 500px) {
            .form-row {
                flex-direction: column;
                gap: 12px;
            }
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-bottom: 12px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        .rate-group {
            max-width: 160px;
        }

        @media (max-width: 500px) {
            .rate-group {
                max-width: 100%;
            }
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        select, input[type="number"], input[type="month"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-main);
            background-color: #fff;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 500;
        }

        .btn-link {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 13px;
            cursor: pointer;
            text-decoration: underline;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s ease;
        }

        .calendar-day:hover:not(.empty) {
            border-color: var(--primary);
            background-color: #f9fafb;
        }

        .calendar-day.empty {
            border: none;
            cursor: default;
        }

        .calendar-day.active.half-1 {
            background-color: var(--half1-bg);
            border-color: var(--half1-color);
            color: var(--half1-color);
            font-weight: 700;
        }

        .calendar-day.active.half-2 {
            background-color: var(--half2-bg);
            border-color: var(--half2-color);
            color: var(--half2-color);
            font-weight: 700;
        }

        .legend {
            display: flex;
            gap: 16px;
            margin-top: 14px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.half-1 { background-color: var(--half1-color); }
        .dot.half-2 { background-color: var(--half2-color); }

        .toggle-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toggle-header h2 {
            margin-bottom: 0;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .subs-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .hint {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .subs-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }

        .sub-row {
            display: grid;
            grid-template-columns: 1.8fr 0.8fr 0.8fr 32px;
            gap: 8px;
            align-items: center;
        }

        .btn-secondary {
            background-color: #f3f4f6;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background-color: #e5e7eb;
        }

        .btn-del {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 20px;
            cursor: pointer;
            line-height: 1;
        }

        .result-block {
            padding: 14px;
            border-radius: 10px;
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            margin-bottom: 12px;
        }

        .result-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .badge {
            background-color: #e2e8f0;
            color: #334155;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }

        .result-details {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .result-sum {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
        }

        .total-block {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-label {
            font-size: 16px;
            font-weight: 700;
        }

        .total-shifts {
            font-size: 13px;
            color: var(--text-muted);
        }

        .total-sum {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary);
        }
